[package]
name = "gongkao-cli"
version = "0.1.0"
edition = "2021"
description = "读本 READBOOK 终端学习 —— 行测刷题 / 时评素材 / 常识 / 时政"
license = "AGPL-3.0-or-later"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-width = "0.2"
anyhow = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
